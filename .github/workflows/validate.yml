name: Validate plugin

on:
  push:
    branches: [main, "2.3.0-dev", "2.3.x-d4", "2.3.x-d42", "2.3.2-dev", "2.3.3-dev", "2.3.4-dev"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code main.js
      - run: npm run check
      - run: npm test
      - run: npm run release:check
